packages:
  - apps/*
  - packages/*
  - website

strictPeerDependencies: false

overrides:
  axios@<0.33.0: ^0.35.0
  glob@>=9.0.0 <14.0.2: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  pacote@<21.5.1: ^21.5.1
  postcss-selector-parser@<6.1.5: ^6.1.5
  serialize-javascript@<7.1.3: ^7.1.3
  sharp@<0.35.5: ^0.35.5
  tinypool@<2.1.2: ^2.1.2
  uuid@<11.1.1: ^13.0.2

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  core-js: false
  esbuild: false
  sharp: true

permissions:
  ultracite:
    skills: false

# TODO: Remove once these versions are older than minimumReleaseAge (1 day).
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.13"
  - "@turbo/darwin-arm64@2.11.13"
  - "@turbo/linux-64@2.11.13"
  - "@turbo/linux-arm64@2.11.13"
  - "@turbo/windows-64@2.11.13"
  - "@turbo/windows-arm64@2.11.13"
  - tailwind-merge@2.6.2
  - turbo@2.11.13
  - ultracite@8.3.0
