packages:
  - apps/*
  - packages/*
  - website

# The versions of the external dependencies that two or more workspace packages
# use directly. Refer to them with `catalog:` in `package.json`. A dependency
# that only one package uses keeps its version in that `package.json`.
catalogMode: prefer

catalog:
  "@base-ui/react": 1.9.0
  "@serwist/turbopack": 9.6.0
  "@tailwindcss/turbopack": 4.3.5
  "@testing-library/react": 16.3.3
  "@types/node": 26.6.11
  "@types/react": 19.3.3
  "@types/react-dom": 19.3.0
  "@vercel/analytics": 2.0.1
  "@vitejs/plugin-react": 6.3.0
  cn: 0.5.2
  contentful: 11.12.10
  esbuild-wasm: 0.28.2
  jsdom: 31.0.1
  lucide-react: 1.82.0
  next: 16.4.6
  react: 19.3.1
  react-dom: 19.3.1
  serwist: 9.6.0
  tailwindcss: 4.3.5
  typescript: 6.0.3
  vite: 8.4.0
  vitest: 5.1.2

strictPeerDependencies: false

overrides:
  axios@<0.33.0: ^0.35.0
  glob@>=9.0.0 <14.0.2: ^14.0.6
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  pacote@<21.5.1: ^21.5.1
  postcss-selector-parser@<6.1.5: ^6.1.5
  serialize-javascript@<7.1.3: ^7.1.3
  sharp@<0.35.5: ^0.35.5
  tinypool@<2.1.2: ^2.1.2
  uuid@<11.1.1: ^11.1.1

allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  "@swc/core": false
  core-js: false
  esbuild: false
  prisma: true
  sharp: true

permissions:
  ultracite:
    skills: false

# TODO: Remove once these versions are older than minimumReleaseAge (1 day).
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.13"
  - "@turbo/darwin-arm64@2.11.13"
  - "@turbo/linux-64@2.11.13"
  - "@turbo/linux-arm64@2.11.13"
  - "@turbo/windows-64@2.11.13"
  - "@turbo/windows-arm64@2.11.13"
  - turbo@2.11.13
  - ultracite@8.3.0
