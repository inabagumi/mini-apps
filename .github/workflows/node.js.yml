name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["!v*"]

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm typegen
      - name: Type check
        run: pnpm typecheck
      - name: Lint and format check
        run: pnpm check
      # - name: Test
      #   run: pnpm test --ci --coverage
