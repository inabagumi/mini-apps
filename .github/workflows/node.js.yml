name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["!v*"]

jobs:
  build:
    runs-on: ubuntu-26.04

    services:
      # For the tests that need a database. Keep the image in sync with
      # `compose.yaml`.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready --username=postgres" --health-interval 5s --health-timeout 3s --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm typegen
      - name: Type check
        run: pnpm typecheck
      - name: Lint and format check
        run: pnpm check
      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  e2e:
    runs-on: ubuntu-26.04

    services:
      # For the E2E tests of animare-shindan. Keep the image in sync with
      # `compose.yaml`.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready --username=postgres" --health-interval 5s --health-timeout 3s --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
      - name: Install Playwright browsers
        run: pnpm --filter @inabagumi/animare-shindan exec playwright install --with-deps --only-shell chromium
      - name: E2E test
        run: pnpm test:e2e
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
