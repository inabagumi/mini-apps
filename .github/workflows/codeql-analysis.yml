name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 20 * * 5"

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-26.04

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
