# Mock servers and other services for development and testing.
name: mini-apps

services:
  # A mock server of the Contentful Content Delivery API. See
  # mocks/contentful/README.md for details.
  contentful:
    # Use the default (Ubuntu-based) variant rather than the Alpine one because
    # the Alpine variant is only published for linux/amd64 and is slow under
    # emulation on arm64 hosts such as Apple silicon.
    image: ghcr.io/wiremock/wiremock:3.13.2-3
    command:
      - --port=4000
      - --enable-stub-cors
      # Read the fixtures on every request so that changes are reflected
      # without restarting.
      - --max-template-cache-entries=0
      - --disable-banner
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://localhost:4000/__admin/health
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - 127.0.0.1:4000:4000
    volumes:
      - ./mocks/contentful:/home/wiremock:ro

  # A mock server of the Upstash Redis REST API. See
  # mocks/upstash-redis/README.md for details.
  upstash-redis:
    image: hiett/serverless-redis-http:0.0.10
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      SRH_CONNECTION_STRING: redis://valkey:6379
      SRH_MODE: env
      SRH_PORT: "4001"
      SRH_TOKEN: mock
    healthcheck:
      # Send a command to make sure that the server can connect to Valkey.
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - "--header=Authorization: Bearer mock"
        - "--header=Content-Type: application/json"
        - '--post-data=["PING"]'
        - http://localhost:4001/
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - 127.0.0.1:4001:4001

  # A PostgreSQL server for the tests that need a database (e.g. the seed and
  # the E2E tests of animare-shindan). Set `TEST_DATABASE_URL` to
  # `postgres://postgres:postgres@127.0.0.1:5432/postgres` to use it. The data
  # is not persisted.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [CMD, pg_isready, --username=postgres]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - 127.0.0.1:5432:5432
    tmpfs:
      - /var/lib/postgresql

  # The data store of the `upstash-redis` service. The data is not persisted.
  valkey:
    image: ghcr.io/valkey-io/valkey:9.2.0-alpine
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
